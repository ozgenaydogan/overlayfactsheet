- id: topic08p15
  translation: "Çok sayıda engelli son kullanıcı"
- id: topic08p16
  translation: "Kısacası, aşağıdaki imzacılar listesi bu alanda uzman olan &amp; profesyonel kariyerlerini erişilebilirliğin iyileştirilmesine adamış kişilerdir veya engelli son kullanıcılardır (veya her ikisi). Aşağıda listelenen isimleri &quot;rakipler&quot; olarak yok saymak hem yanlıştır hem de noktayı kaçırır: katmanlar, erişilebilirliği sağlamanın etkili bir yolu değildir - aşağıdaki tüm insanların hemfikir olduğu bir nokta."
